<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="💸 Gasto">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.json">
  <title>💸 Gasto</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, sans-serif;
      background: #000;
      color: #fff;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top, 20px) 20px env(safe-area-inset-bottom, 20px);
      gap: 12px;
      overflow: hidden;
    }

    h1 { font-size: 20px; font-weight: 700; padding-top: 8px; }

    textarea {
      flex: 1;
      background: #1c1c1e;
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-size: 17px;
      font-family: -apple-system, sans-serif;
      resize: none;
      outline: none;
      min-height: 0;
    }
    textarea::placeholder { color: #555; }

    .actions {
      display: flex;
      gap: 10px;
    }

    #btn-mic {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: none;
      background: #1c1c1e;
      font-size: 28px;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #btn-mic.recording { background: #ff453a; animation: pulse 1s infinite; }
    #btn-mic:active { opacity: 0.7; }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    #btn-save {
      flex: 1;
      height: 64px;
      background: #30d158;
      color: #000;
      border: none;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    #btn-save:active { opacity: 0.7; }

    #status {
      text-align: center;
      font-size: 14px;
      min-height: 18px;
      color: #888;
    }
    #status.ok { color: #30d158; }
    #status.err { color: #ff453a; }

    /* Cola de pendientes */
    #queue-section { display: none; }
    #queue-section.visible { display: block; }

    #queue-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    #queue-title { font-size: 14px; font-weight: 600; color: #ff9f0a; }

    #queue-list { display: flex; flex-direction: column; gap: 6px; max-height: 140px; overflow-y: auto; }

    .queue-item {
      background: #1c1c1e;
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .queue-item-text { flex: 1; font-size: 13px; color: #ccc; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .queue-item-attempts { font-size: 11px; color: #555; flex-shrink: 0; }
    .queue-item-retry {
      background: #2c2c2e;
      border: none;
      color: #0a84ff;
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .queue-item-delete {
      background: none;
      border: none;
      color: #ff453a;
      font-size: 16px;
      cursor: pointer;
      flex-shrink: 0;
      padding: 0 4px;
    }
  </style>
</head>
<body>
  <h1>💸 ¿Qué gastaste?</h1>

  <textarea id="txt" placeholder="Escribe o usa el micrófono…"></textarea>

  <div id="status"></div>

  <div class="actions">
    <button id="btn-mic" onclick="toggleMic()" title="Grabar voz">🎤</button>
    <button id="btn-save" onclick="guardar()">Guardar</button>
  </div>

  <div id="queue-section">
    <div id="queue-header">
      <span id="queue-title">⚠️ Pendientes</span>
    </div>
    <div id="queue-list"></div>
  </div>

  <script>
    const API = 'https://o2gdi50tlk.execute-api.us-east-1.amazonaws.com/api/v1/drafts';
    const KEY = 'OD4WpBVxtYpjjfgAEmETUVYGaxIdYva3uPdwnl0K6tI';
    const QUEUE_KEY = 'draft_queue_v1';
    const BACKOFF = [3000, 6000, 12000, 24000, 48000];

    // ── Cola ──────────────────────────────────────────────
    function loadQueue() {
      try { return JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]'); } catch { return []; }
    }
    function saveQueue(q) { localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); }

    function enqueue(text) {
      const q = loadQueue();
      q.push({ id: Date.now().toString(), text, attempts: 0 });
      saveQueue(q);
      renderQueue();
      scheduleRetry();
    }

    function removeFromQueue(id) {
      saveQueue(loadQueue().filter(i => i.id !== id));
      renderQueue();
    }

    function renderQueue() {
      const q = loadQueue();
      const section = document.getElementById('queue-section');
      const list = document.getElementById('queue-list');
      if (q.length === 0) { section.classList.remove('visible'); return; }
      section.classList.add('visible');
      list.innerHTML = q.map(item => `
        <div class="queue-item">
          <span class="queue-item-text">${item.text}</span>
          <span class="queue-item-attempts">${item.attempts} intentos</span>
          <button class="queue-item-retry" onclick="retryItem('${item.id}')">Reintentar</button>
          <button class="queue-item-delete" onclick="removeFromQueue('${item.id}')">✕</button>
        </div>
      `).join('');
    }

    async function sendToAPI(text) {
      const res = await fetch(API, {
        method: 'POST',
        headers: { 'content-type': 'application/json', 'x-api-key': KEY },
        body: JSON.stringify({ text })
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
    }

    async function retryItem(id) {
      const q = loadQueue();
      const item = q.find(i => i.id === id);
      if (!item) return;
      try {
        await sendToAPI(item.text);
        removeFromQueue(id);
        setStatus('✓ Guardado', 'ok');
      } catch {
        item.attempts++;
        saveQueue(q);
        renderQueue();
      }
    }

    function scheduleRetry() {
      const q = loadQueue();
      if (q.length === 0) return;
      const item = q[0];
      const delay = BACKOFF[Math.min(item.attempts, BACKOFF.length - 1)];
      setTimeout(async () => {
        const current = loadQueue();
        const i = current.find(x => x.id === item.id);
        if (!i) return;
        try {
          await sendToAPI(i.text);
          removeFromQueue(i.id);
          setStatus('✓ Guardado (reintento)', 'ok');
        } catch {
          i.attempts++;
          saveQueue(current);
          renderQueue();
          scheduleRetry();
        }
      }, delay);
    }

    // ── Guardar optimista ─────────────────────────────────
    function setStatus(msg, cls) {
      const s = document.getElementById('status');
      s.textContent = msg;
      s.className = cls || '';
      if (cls === 'ok') setTimeout(() => { s.textContent = ''; s.className = ''; }, 2000);
    }

    async function guardar() {
      const txt = document.getElementById('txt').value.trim();
      if (!txt) return;
      document.getElementById('txt').value = '';
      setStatus('✓ Guardado', 'ok');          // optimista — respuesta inmediata
      try {
        await sendToAPI(txt);
      } catch {
        setStatus('Sin conexión — en cola', 'err');
        enqueue(txt);
      }
    }

    // ── Micrófono ─────────────────────────────────────────
    let recognition = null;
    let isRecording = false;

    function toggleMic() {
      if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        setStatus('Tu navegador no soporta voz', 'err');
        return;
      }
      if (isRecording) {
        recognition.stop();
        return;
      }
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SR();
      recognition.lang = 'es-CO';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        isRecording = true;
        document.getElementById('btn-mic').classList.add('recording');
        setStatus('Escuchando…');
      };
      recognition.onresult = (e) => {
        const transcript = e.results[0][0].transcript;
        document.getElementById('txt').value = transcript;
      };
      recognition.onend = () => {
        isRecording = false;
        document.getElementById('btn-mic').classList.remove('recording');
        setStatus('');
        // si hay texto, guardar automáticamente
        const txt = document.getElementById('txt').value.trim();
        if (txt) guardar();
      };
      recognition.onerror = (e) => {
        isRecording = false;
        document.getElementById('btn-mic').classList.remove('recording');
        setStatus('Error de micrófono: ' + e.error, 'err');
      };
      recognition.start();
    }

    // ── Init ──────────────────────────────────────────────
    renderQueue();
    scheduleRetry();

    // Cmd+Enter / Enter en desktop guarda
    document.getElementById('txt').addEventListener('keydown', e => {
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) guardar();
    });
  </script>
</body>
</html>
