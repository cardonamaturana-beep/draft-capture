<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="💸 Gasto">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.json">
  <title>💸 Gasto</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, sans-serif;
      background: #000;
      color: #fff;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top, 16px) 16px env(safe-area-inset-bottom, 16px);
      gap: 10px;
    }
    #top {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    h1 { font-size: 18px; font-weight: 700; }
    textarea {
      background: #1c1c1e;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 12px;
      font-size: 16px;
      font-family: -apple-system, sans-serif;
      resize: none;
      outline: none;
      height: 100px;
      width: 100%;
    }
    textarea::placeholder { color: #555; }

    /* ── Barra de acciones ── */
    #action-row {
      display: flex;
      gap: 10px;
      align-items: stretch;
    }
    #btn-save {
      flex: 1;
      height: 52px;
      background: #30d158;
      color: #000;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }
    #btn-save:active { opacity: 0.7; }

    #btn-attach {
      width: 52px;
      height: 52px;
      background: #1c1c1e;
      border: none;
      border-radius: 12px;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      position: relative;
    }
    #btn-attach:active { opacity: 0.7; }
    #btn-attach.has-image { background: #0a84ff22; }
    #attach-badge {
      display: none;
      position: absolute;
      top: 4px; right: 4px;
      width: 10px; height: 10px;
      background: #0a84ff;
      border-radius: 50%;
    }
    #btn-attach.has-image #attach-badge { display: block; }

    /* ── Preview imagen ── */
    #image-preview-wrap {
      display: none;
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      background: #1c1c1e;
      max-height: 140px;
    }
    #image-preview-wrap.visible { display: block; }
    #image-preview {
      width: 100%;
      max-height: 140px;
      object-fit: cover;
      display: block;
      border-radius: 12px;
    }
    #btn-remove-image {
      position: absolute;
      top: 6px; right: 6px;
      background: rgba(0,0,0,0.6);
      border: none;
      color: #fff;
      font-size: 16px;
      width: 28px; height: 28px;
      border-radius: 50%;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }

    #mic-hint { font-size: 12px; color: #444; text-align: center; }
    #status { text-align: center; font-size: 13px; min-height: 16px; color: #888; }
    #status.ok { color: #30d158; }
    #status.err { color: #ff453a; }
    #status.warn { color: #ff9f0a; }

    /* ── Cola offline ── */
    #queue-section { display: none; margin-top: 8px; }
    #queue-section.visible { display: block; }
    #queue-title { font-size: 13px; font-weight: 600; color: #ff9f0a; margin-bottom: 6px; }
    #queue-list { display: flex; flex-direction: column; gap: 5px; max-height: 120px; overflow-y: auto; }
    .queue-item {
      background: #1c1c1e;
      border-radius: 10px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .queue-item-text { flex: 1; font-size: 12px; color: #ccc; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .queue-item-attempts { font-size: 10px; color: #555; flex-shrink: 0; }
    .queue-item-retry { background: #2c2c2e; border: none; color: #0a84ff; font-size: 11px; padding: 3px 7px; border-radius: 5px; cursor: pointer; }
    .queue-item-delete { background: none; border: none; color: #ff453a; font-size: 15px; cursor: pointer; padding: 0 2px; }
  </style>
</head>
<body>
  <div id="top">
    <h1>💸 ¿Qué gastaste?</h1>
    <textarea id="txt" autofocus placeholder="Escribe, dicta 🎤 o adjunta una imagen 📎…" rows="3"></textarea>

    <!-- Preview imagen seleccionada -->
    <div id="image-preview-wrap">
      <img id="image-preview" src="" alt="preview">
      <button id="btn-remove-image" onclick="removeImage()">✕</button>
    </div>

    <div id="status"></div>

    <!-- Barra: botón adjuntar + botón guardar -->
    <div id="action-row">
      <button id="btn-attach" onclick="triggerFilePicker()" title="Adjuntar imagen">
        📎
        <span id="attach-badge"></span>
      </button>
      <button id="btn-save" onclick="guardar()">Guardar</button>
    </div>

    <div id="mic-hint">🎤 Toca el micrófono de tu teclado para dictar</div>
  </div>

  <!-- Input de archivo oculto -->
  <input type="file" id="file-input" accept="image/*" style="display:none" onchange="onImageSelected(event)">

  <div id="queue-section">
    <div id="queue-title">⚠️ Pendientes</div>
    <div id="queue-list"></div>
  </div>

  <script>
    const API = 'https://o2gdi50tlk.execute-api.us-east-1.amazonaws.com/api/v1/drafts';
    const KEY = 'OD4WpBVxtYpjjfgAEmETUVYGaxIdYva3uPdwnl0K6tI';
    const QUEUE_KEY = 'draft_queue_v1';
    const BACKOFF = [3000, 6000, 12000, 24000, 48000];
    const MAX_IMAGE_BYTES = 4 * 1024 * 1024; // 4MB

    let _imageBase64 = null;   // base64 de la imagen seleccionada (null si no hay)
    let _imageMime   = null;   // mime type de la imagen

    // ── Imagen ──────────────────────────────────────────────────────────────

    function triggerFilePicker() {
      document.getElementById('file-input').click();
    }

    function onImageSelected(e) {
      const file = e.target.files[0];
      if (!file) return;

      // Validar tamaño
      if (file.size > MAX_IMAGE_BYTES) {
        setStatus('Imagen muy grande — usa una captura de pantalla (máx 4MB)', 'err');
        e.target.value = '';
        return;
      }

      const reader = new FileReader();
      reader.onload = (ev) => {
        _imageBase64 = ev.target.result;  // data:image/...;base64,...
        _imageMime = file.type;

        // Mostrar preview
        const preview = document.getElementById('image-preview');
        const wrap = document.getElementById('image-preview-wrap');
        preview.src = _imageBase64;
        wrap.classList.add('visible');

        // Badge en botón adjuntar
        document.getElementById('btn-attach').classList.add('has-image');
        setStatus('', '');
      };
      reader.readAsDataURL(file);
    }

    function removeImage() {
      _imageBase64 = null;
      _imageMime = null;
      document.getElementById('image-preview').src = '';
      document.getElementById('image-preview-wrap').classList.remove('visible');
      document.getElementById('btn-attach').classList.remove('has-image');
      document.getElementById('file-input').value = '';
    }

    // ── Cola offline ─────────────────────────────────────────────────────────

    function loadQueue() {
      try { return JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]'); } catch { return []; }
    }
    function saveQueue(q) { localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); }

    function enqueue(text, imageBase64) {
      const q = loadQueue();
      q.push({ id: Date.now().toString(), text, imageBase64: imageBase64 || null, attempts: 0 });
      try {
        saveQueue(q);
      } catch (e) {
        // localStorage lleno (típico con imágenes grandes) — guardar sin imagen
        const qSinImg = loadQueue();
        qSinImg.push({ id: Date.now().toString(), text, imageBase64: null, attempts: 0 });
        try {
          saveQueue(qSinImg);
          setStatus('Imagen no guardada en cola (muy grande) — texto sí guardado', 'warn');
        } catch {
          setStatus('No se pudo guardar en cola — intenta de nuevo', 'err');
          return;
        }
      }
      renderQueue();
      scheduleRetry();
    }

    // Comprime una imagen base64 a máximo 800px y calidad 0.65 JPEG (~100-200KB)
    function comprimirImagen(base64, callback) {
      const img = new Image();
      img.onload = () => {
        const MAX = 800;
        let w = img.width, h = img.height;
        if (w > MAX || h > MAX) {
          if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
          else { w = Math.round(w * MAX / h); h = MAX; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        callback(canvas.toDataURL('image/jpeg', 0.65));
      };
      img.onerror = () => callback(base64); // si falla, usar original
      img.src = base64;
    }

    function removeFromQueue(id) {
      saveQueue(loadQueue().filter(i => i.id !== id));
      renderQueue();
    }

    function renderQueue() {
      const q = loadQueue();
      const section = document.getElementById('queue-section');
      const list = document.getElementById('queue-list');
      if (q.length === 0) { section.classList.remove('visible'); return; }
      section.classList.add('visible');
      list.innerHTML = q.map(item => `
        <div class="queue-item">
          <span class="queue-item-text">${item.imageBase64 ? '📎 ' : ''}${item.text || '(solo imagen)'}</span>
          <span class="queue-item-attempts">${item.attempts}x</span>
          <button class="queue-item-retry" onclick="retryItem('${item.id}')">Reintentar</button>
          <button class="queue-item-delete" onclick="removeFromQueue('${item.id}')">✕</button>
        </div>
      `).join('');
    }

    // ── API ──────────────────────────────────────────────────────────────────

    async function sendToAPI(text, imageBase64) {
      const payload = { text: text || '' };
      if (imageBase64) {
        payload.image_base64 = imageBase64;
        payload.source = 'pwa_image';
      } else {
        payload.source = 'pwa';
      }

      const res = await fetch(API, {
        method: 'POST',
        headers: { 'content-type': 'application/json', 'x-api-key': KEY },
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
    }

    async function retryItem(id) {
      const q = loadQueue();
      const item = q.find(i => i.id === id);
      if (!item) return;
      try {
        await sendToAPI(item.text, item.imageBase64);
        removeFromQueue(id);
        setStatus('✓ Guardado', 'ok');
      } catch {
        item.attempts++;
        saveQueue(q);
        renderQueue();
      }
    }

    function scheduleRetry() {
      const q = loadQueue();
      if (q.length === 0) return;
      const item = q[0];
      const delay = BACKOFF[Math.min(item.attempts, BACKOFF.length - 1)];
      setTimeout(async () => {
        const current = loadQueue();
        const i = current.find(x => x.id === item.id);
        if (!i) return;
        try {
          await sendToAPI(i.text, i.imageBase64);
          removeFromQueue(i.id);
          setStatus('✓ Guardado (reintento)', 'ok');
        } catch {
          i.attempts++;
          saveQueue(current);
          renderQueue();
          scheduleRetry();
        }
      }, delay);
    }

    // ── Guardar ──────────────────────────────────────────────────────────────

    function setStatus(msg, cls) {
      const s = document.getElementById('status');
      s.textContent = msg;
      s.className = cls || '';
      if (cls === 'ok') setTimeout(() => { s.textContent = ''; s.className = ''; }, 2000);
    }

    async function guardar() {
      const txt = document.getElementById('txt').value.trim();
      const img = _imageBase64;

      if (!txt && !img) return;

      // Limpiar UI inmediatamente (guardado optimista)
      document.getElementById('txt').value = '';
      removeImage();
      setStatus('✓ Guardado', 'ok');
      document.getElementById('txt').focus();

      if (img) {
        // Comprimir antes de enviar/encolar para evitar límite localStorage
        comprimirImagen(img, async (imgComprimida) => {
          try {
            await sendToAPI(txt, imgComprimida);
          } catch {
            setStatus('Sin conexión — en cola', 'err');
            enqueue(txt, imgComprimida);
          }
        });
      } else {
        try {
          await sendToAPI(txt, null);
        } catch {
          setStatus('Sin conexión — en cola', 'err');
          enqueue(txt, null);
        }
      }
    }

    // ── Atajos de teclado ────────────────────────────────────────────────────

    document.getElementById('txt').addEventListener('keydown', e => {
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) guardar();
    });

    // ── Init ─────────────────────────────────────────────────────────────────

    renderQueue();
    scheduleRetry();

    window.addEventListener('load', () => {
      setTimeout(() => document.getElementById('txt').focus(), 300);
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').then(reg => {
        reg.addEventListener('updatefound', () => {
          const sw = reg.installing;
          sw.addEventListener('statechange', () => {
            if (sw.state === 'installed' && navigator.serviceWorker.controller) {
              window.location.reload();
            }
          });
        });
      });
    }
  </script>
</body>
</html>
